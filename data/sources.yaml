# Public sources for Hearthguard (pre-event notes, Oct 12, 2026).
# Source of list: docs/HEARTHGUARD.md §23 and §3.
# status: UNVERIFIED for every entry. Verify each URL on Day 1 and cache every fetch
# to data/raw/ with its URL and fetch time.
# url "TBD, VERIFY Day 1" means the spec gives no URL for this item.

sources:
  # --- xz (CVE-2024-3094) primary and ecosystem records ---
  - id: xz_timeline_russ_cox
    url: "https://research.swtch.com/xz-timeline"
    expect: "Public timeline of the xz attack. Index only: use it to find primary records, not as a primary source (§23)."
    status: UNVERIFIED

  - id: xz_devel_archive
    url: "TBD, VERIFY Day 1"
    expect: "xz-devel mailing list messages msg00512 to msg00571 (2021-2022). Includes msg00563 (2022-05-19, 'resources are too limited'), the 2021-10-29 first patch and the 2022-06-29 'practically a co-maintainer already' message."
    status: UNVERIFIED

  - id: xz_git_history
    url: "TBD, VERIFY Day 1"
    expect: "Commits and releases. 2022: commit then release rights. 2023-03 onward: release tags. 2024-02-23: hidden payload merged. 2024-02-24: tag 5.6.0. 2024-03-09: tag 5.6.1. Payload in test files and a modified release tarball."
    status: UNVERIFIED

  - id: oss_fuzz_commit_6403e933
    url: "https://github.com/google/oss-fuzz/commit/6403e933.patch"
    expect: "2023-03-20: bug reports re-routed to Jia Tan."
    status: FETCHED 2026-10-12 HTTP 200 (eval/results/ecosystem_sources.json)

  - id: oss_fuzz_commit_d2e42b2e
    url: "https://github.com/google/oss-fuzz/commit/d2e42b2e.patch"
    expect: "2023-07-07: ifunc disabled in xz's oss-fuzz build."
    status: FETCHED 2026-10-12 HTTP 200 (eval/results/ecosystem_sources.json)

  - id: lkml_2024_3_20_1008
    url: "https://lkml.org/lkml/2024/3/20/1008"
    expect: "2024-03-20: kernel patch listing Jia Tan as an xz maintainer."
    status: FETCHED 2026-10-12 HTTP 200 (eval/results/ecosystem_sources.json)

  - id: debian_bug_1067708
    url: "https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1067708"
    expect: "2024-03-25: Hans Jansen asks Debian to update to 5.6.1."
    status: FETCHED 2026-10-12 HTTP 200 (eval/results/ecosystem_sources.json)

  - id: ubuntu_launchpad_bug_2059417
    url: "https://bugs.launchpad.net/ubuntu/+source/xz-utils/+bug/2059417"
